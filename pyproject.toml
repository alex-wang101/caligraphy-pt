[project]
name = "calligraphy"
version = "0.1.0"
description = "Calligraphy agent: stroke renderer, SFT converter, geometric scorer and data splits"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "shapely>=2.0",
    "pyarrow>=17.0",
    "huggingface_hub>=0.25",
    "perfect-freehand>=1.2",
]

[project.optional-dependencies]
viewer = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs downloaded datasets in data/ (run scripts/fetch_data.py)"]
